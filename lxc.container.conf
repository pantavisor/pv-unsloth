# LXC Container Configuration for Unsloth with GPU Passthrough

lxc.tty.max = 8
lxc.pty.max = 1024

# Retain host namespaces for high throughput
lxc.namespace.keep = user net ipc

# PyTorch, Triton compile cache, and CUDA need substantial shared memory
lxc.mount.entry = tmpfs dev/shm tmpfs rw,nosuid,nodev,mode=1777,size=8g 0 0

# Persistent storage for downloaded LLM weights
lxc.mount.entry = /storage/disks/unsloth-models models none bind,create=dir 0 0

# Allow CGroup access to character devices:
# 195: NVIDIA character devices (nvidiactl, nvidia-uvm, nvidia0...)
# 10: Misc major (nvmap, nvhost-ctrl on Tegra)
# 234-239: Tegra host & hardware accelerator devices
lxc.cgroup.devices.allow = c 195:* rwm
lxc.cgroup.devices.allow = c 10:* rwm
lxc.cgroup.devices.allow = c 226:* rwm
lxc.cgroup.devices.allow = c 234:* rwm
lxc.cgroup.devices.allow = c 235:* rwm
lxc.cgroup.devices.allow = c 236:* rwm
lxc.cgroup.devices.allow = c 237:* rwm
lxc.cgroup.devices.allow = c 238:* rwm
lxc.cgroup.devices.allow = c 239:* rwm
